<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 170" width="100%" height="170" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;family=Outfit:wght@600;700&amp;display=swap');
      
      .bg-rect {
        fill: #0d1117;
        stroke: rgba(0, 255, 136, 0.25);
        stroke-width: 1.5;
        rx: 16px;
      }
      
      .track-1 {
        display: flex;
        animation: scrollLeft 28s linear infinite;
      }
      
      .track-2 {
        display: flex;
        animation: scrollRight 26s linear infinite;
      }

      @keyframes scrollLeft {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-960px); }
      }

      @keyframes scrollRight {
        0% { transform: translateX(-960px); }
        100% { transform: translateX(0px); }
      }

      .badge-card {
        fill: #161b22;
        stroke: rgba(0, 255, 136, 0.35);
        stroke-width: 1.2;
        rx: 10px;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      }

      .badge-text {
        font-family: 'Outfit', 'Fira Code', sans-serif;
        font-weight: 700;
        font-size: 13.5px;
        fill: #ffffff;
      }

      .badge-sub {
        font-family: 'Fira Code', monospace;
        font-weight: 600;
        font-size: 10px;
        fill: #00ff88;
      }

      .glow-particle {
        animation: pulseGlow 3s ease-in-out infinite alternate;
      }

      @keyframes pulseGlow {
        0% { opacity: 0.3; }
        100% { opacity: 0.8; }
      }
    </style>

    <linearGradient id="edgeFadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="edgeFadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="950" height="170" class="bg-rect" />

  <!-- ROW 1: Rotating Moving Left -->
  <g transform="translate(0, 22)">
    <g class="track-1">
