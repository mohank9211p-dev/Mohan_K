      <g transform="translate(0, 0)">
        <rect width="145" height="46" class="badge-card" />
        <circle cx="24" cy="23" r="12" fill="#61DAFB" fill-opacity="0.2" stroke="#61DAFB" stroke-width="1.5" />
        <text x="24" y="27" font-size="12" text-anchor="middle" fill="#61DAFB" font-family="'Fira Code', monospace">⚛</text>
        <text x="46" y="24" class="badge-text">React.js</text>
        <text x="46" y="37" class="badge-sub">Frontend</text>
